<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1C2431" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Norte — tu norte financiero. Elige la mejor tarjeta y la mejor cuenta en cada movimiento." />
<title>Norte</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 42'%3E%3Crect width='42' height='42' rx='11' fill='%231C2431'/%3E%3Cpolygon points='21,8 26,22 21,19.5 16,22' fill='%23D67B4C'/%3E%3Cpolygon points='21,34 16,22 21,24.5 26,22' fill='%238a97a6'/%3E%3Ccircle cx='21' cy='21.5' r='2.2' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<script defer crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script defer crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{
  --ink:#1C2431; --ink-2:#2A3340; --ink-3:#48525F;
  --copper:#B85F35; --copper-2:#D67B4C; --copper-soft:#F7EAE1;
  --teal:#0F7365; --teal-soft:#E6F1EE;
  --sand:#8F6210; --sand-soft:#F6EEDD;
  --danger:#A83229; --danger-soft:#FBEDEB;
  --bg:#F6F5F1; --surface:#FFFFFF; --surface-2:#FBFAF7;
  --line:#E7E4DD; --line-2:#F1EFEA;
  --muted:#7C8492; --text:#1E2733;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --sh-1:0 1px 2px rgba(28,36,49,.04);
  --sh-2:0 1px 2px rgba(28,36,49,.04),0 10px 24px rgba(28,36,49,.07);
  --sh-3:0 -8px 40px rgba(28,36,49,.16);
  --top-h:54px; --nav-h:60px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.02em}
.num{font-family:"Space Grotesk",Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cap::first-letter{text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- shell ---------- */
.app{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.10)}
.topbar{position:sticky;top:0;z-index:30;height:var(--top-h);background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 0 14px}
.brand{font-family:"Space Grotesk";font-weight:700;font-size:16.5px;letter-spacing:-.02em;
  display:flex;align-items:center;gap:8px}
.topbar-title{position:absolute;left:0;right:0;text-align:center;pointer-events:none;
  font-family:"Space Grotesk";font-weight:600;font-size:15.5px}
.topbar-r{display:flex;align-items:center;gap:10px;margin-left:auto;z-index:1}
.avatar-btn{width:30px;height:30px;border-radius:999px;border:0;color:#fff;
  font-family:"Space Grotesk";font-weight:700;font-size:13px;display:grid;place-items:center}
.screen{padding:14px 14px calc(var(--nav-h) + var(--safe-b) + 22px);display:flex;flex-direction:column;gap:12px}
.banner{background:#3A2A24;color:#F6DCCF;font-size:13px;padding:9px 14px;display:flex;align-items:center;gap:8px}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:rgba(255,255,255,.94);backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.tabb{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:10.5px;font-weight:500;letter-spacing:.01em;padding:0;
  transition:color .15s}
.tabb.on{color:var(--copper);font-weight:600}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--sh-1)}
.panel.sand{background:var(--sand-soft);border-color:#E6D6B2}
.tap-panel{display:block;width:100%;text-align:left;border:1px solid var(--line)}
.tap-panel:active{transform:scale(.995)}
.sticky-tools{position:sticky;top:var(--top-h);z-index:12;margin:-14px -14px 0;padding:14px;
  border-radius:0;border-left:0;border-right:0;border-top:0;box-shadow:0 6px 16px rgba(28,36,49,.06)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ph-l{font-family:"Space Grotesk";font-weight:600;font-size:14.5px;color:var(--ink);
  display:flex;align-items:center;gap:7px}
.ph-r{font-size:12.5px;color:var(--muted);font-family:"Space Grotesk";font-variant-numeric:tabular-nums}
.ph-r.teal{color:var(--teal);font-weight:600}
.sub{color:var(--muted);font-size:13.5px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.note.warn{color:var(--sand)}
.note.center{text-align:center}
.hint{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);
  background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r-md);padding:12px 14px}
.link{background:none;border:0;color:var(--copper);font-size:13px;font-weight:600;padding:0}
.version{text-align:center;font-size:12px;color:var(--muted);padding:6px 0 2px}

/* ---------- forms ---------- */
.fld{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 8px;
  letter-spacing:.02em;text-transform:uppercase}
.amount-box{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface-2);padding:6px 10px 6px 14px}
.amount-box:focus-within{border-color:var(--copper);background:#fff;box-shadow:0 0 0 3px var(--copper-soft)}
.amount-cur{font-family:"Space Grotesk";font-weight:600;font-size:22px;color:var(--muted)}
.amount-in{flex:1;min-width:0;border:0;background:none;outline:none;padding:8px 0;
  font-family:"Space Grotesk";font-weight:700;font-size:28px;letter-spacing:-.02em;color:var(--ink)}
.amount-in::-webkit-outer-spin-button,.amount-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amount-in[type=number]{-moz-appearance:textfield}
.chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-3);font-family:"Space Grotesk"}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.text-in,.pin-in{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-md);
  font:inherit;background:var(--surface-2);color:var(--text);outline:none}
.text-in:focus,.pin-in:focus{border-color:var(--copper);background:#fff;box-shadow:0 0 0 3px var(--copper-soft)}
.pin-in{text-align:center;letter-spacing:.5em;font-size:20px;font-family:"Space Grotesk"}
.search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface-2);padding:0 8px 0 13px;color:var(--muted)}
.search:focus-within{border-color:var(--copper);background:#fff;box-shadow:0 0 0 3px var(--copper-soft)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;padding:12px 0;font:inherit;color:var(--text)}

.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;color:var(--muted);
  font-size:13.5px;font-weight:600;transition:all .15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
.seg-sm button{padding:6px;font-size:12.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;
  border-radius:var(--r-md);padding:14px;font-weight:600;font-size:15px;background:var(--copper);color:#fff;
  transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--copper-soft);color:var(--copper)}
.btn.teal{background:var(--teal)}
.btn.ok{background:var(--teal-soft);color:var(--teal)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger-ghost{background:var(--danger-soft);color:var(--danger)}
.icon-btn{border:0;background:var(--bg);color:var(--muted);border-radius:9px;padding:7px;display:grid;place-items:center}
.icon-btn.ghost{background:none}
.icon-btn.light{background:rgba(255,255,255,.14);color:#fff;z-index:1}
.pill-btn{border:1px solid var(--line);background:var(--surface);color:var(--copper);border-radius:999px;
  width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto}
.pill-btn.held{background:var(--teal-soft);border-color:var(--teal-soft);color:var(--teal)}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-2);
  width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-of-type{border-top:0}
.row.tap:active{opacity:.6}
.row-ico{width:34px;height:34px;border-radius:10px;background:var(--bg);color:var(--ink-3);
  display:grid;place-items:center;flex:0 0 auto}
.row-main{flex:1;min-width:0}
.row-t{font-weight:600;font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-r{text-align:right;flex:0 0 auto;font-size:14.5px;font-weight:600;color:var(--ink)}
.row-r.teal-sub .row-rs{color:var(--teal)}
.row-rs{font-size:12px;color:var(--muted);font-family:"Space Grotesk";font-weight:500;margin-top:1px}
.row-chev{color:#C6C9D0;display:flex;flex:0 0 auto}

/* ---------- stats ---------- */
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini-grid.three{grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px}
.stat-l{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.stat-v{font-size:19px;font-weight:700;color:var(--ink);margin-top:3px}
.stat.teal .stat-v{color:var(--teal)}
.stat-s{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- home ---------- */
.greet{font-size:15px;color:var(--muted);padding:2px 2px 0}
.greet b{color:var(--ink);font-weight:600}
.hero{background:linear-gradient(158deg,#212B3A 0%,#1C2431 62%,#241F1C 100%);color:#fff;
  border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-2)}
.hero-l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9AA5B4}
.hero-v{font-family:"Space Grotesk";font-weight:700;font-size:36px;letter-spacing:-.03em;margin-top:4px;
  color:#fff}
.hero-s{font-size:12.5px;color:#8A97A6;margin-top:2px}
.hero-split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-top:16px;
  border-top:1px solid rgba(255,255,255,.10)}
.hs-l{font-size:11.5px;color:#8A97A6}
.hs-v{font-family:"Space Grotesk";font-weight:600;font-size:17px;margin-top:2px;color:#F0EDE8}
.hs-u{font-size:11.5px;color:#8A97A6;font-weight:500;margin-left:2px}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick-b{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;box-shadow:var(--sh-1);text-align:left}
.quick-b:active{transform:scale(.99)}
.quick-i{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:7px}
.quick-t{font-family:"Space Grotesk";font-weight:600;font-size:14.5px;color:var(--ink)}
.quick-s{font-size:12px;color:var(--muted);line-height:1.35}

.pick-mini{display:flex;align-items:center;gap:12px}
.pick-mini-m{min-width:0}
.pick-mini-n{font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-mini-s{font-size:12.5px;color:var(--muted);margin-top:1px}

/* ---------- profile ---------- */
.profile-head{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 0 6px}
.p-avatar{width:66px;height:66px;border-radius:999px;color:#fff;display:grid;place-items:center;
  font-family:"Space Grotesk";font-weight:700;font-size:27px;flex:0 0 auto;
  box-shadow:0 6px 18px rgba(28,36,49,.16)}
.p-name{font-family:"Space Grotesk";font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--ink);margin-top:6px}
.p-role{font-size:12.5px;color:var(--muted)}

/* ---------- verdict ---------- */
.verdict{border:1.5px solid var(--teal);background:var(--teal-soft);border-radius:var(--r-lg);padding:18px}
.verdict.neutral{border-color:var(--line);background:var(--surface)}
.v-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--teal);
  display:flex;align-items:center;gap:6px}
.verdict.neutral .v-eyebrow{color:var(--muted)}
.v-card{display:flex;align-items:center;gap:12px;margin:12px 0 14px}
.v-name{font-family:"Space Grotesk";font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--ink);line-height:1.2}
.v-issuer{font-size:12.5px;color:var(--muted);margin-top:2px}
.v-amount{font-family:"Space Grotesk";font-weight:700;font-size:34px;letter-spacing:-.03em;color:var(--teal)}
.verdict.neutral .v-amount{color:var(--ink)}
.v-sub{font-size:13px;color:var(--muted);margin-top:1px}
.v-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.75);
  color:var(--ink-3);border:1px solid rgba(28,36,49,.07)}
.tag.amber{background:var(--sand-soft);color:var(--sand);border-color:transparent}
.tag.warn{background:#F7E4E1;color:var(--danger);border-color:transparent}
.tag.teal{background:#D6EBE5;color:var(--teal);border-color:transparent}
.verdict .btn{margin-top:16px}
.bd{border-top:1px dashed rgba(28,36,49,.16);margin-top:14px;padding-top:11px}
.bd-li{display:flex;justify-content:space-between;gap:14px;font-size:13.5px;padding:3px 0;color:var(--ink-3)}

/* ---------- category grid ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);
  padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-3)}
.cat span{font-size:10.5px;font-weight:500;line-height:1.2;text-align:center;color:var(--muted)}
.cat.on{background:var(--copper-soft);border-color:var(--copper);color:var(--copper)}
.cat.on span{color:var(--copper);font-weight:600}

/* ---------- accounts ---------- */
.acct-row{border-top:1px solid var(--line-2);padding:4px 0}
.acct-row:first-of-type{border-top:0}
.acct-row.on{background:var(--copper-soft);border-radius:var(--r-md);border-top-color:transparent;
  margin:4px -8px;padding:6px 8px}
.acct-main{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:8px 0;text-align:left}
.acct-mid{flex:1;min-width:0}
.acct-n{font-weight:600;font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.acct-m{font-size:12px;color:var(--muted);margin-top:2px}
.acct-r{text-align:right;flex:0 0 auto}
.acct-benefit{font-size:15px;font-weight:700;color:var(--ink)}
.acct-u{font-size:11px;color:var(--muted);font-weight:500;margin-left:1px}
.acct-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 0 6px 52px}
.bal-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;
  font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px;font-weight:500}
.mini-badge{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:var(--teal-soft);color:var(--teal);padding:2px 7px;border-radius:999px}

/* ---------- banks ---------- */
.bank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.bank-tile{position:relative;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);
  padding:13px 7px 11px;display:flex;flex-direction:column;align-items:center;gap:7px}
.bank-tile:active{transform:scale(.98)}
.bank-n{font-size:11.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bank-c{font-size:10.5px;color:var(--muted)}
.bank-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:999px;background:var(--teal)}

/* ---------- picks ---------- */
.pick{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);
  border-radius:var(--r-md);padding:14px;margin-bottom:10px}
.pick:last-child{margin-bottom:0}
.pick:active{transform:scale(.995)}
.pick-top{display:flex;align-items:center;gap:12px}
.pick-id{flex:1;min-width:0}
.pick-n{font-family:"Space Grotesk";font-weight:600;font-size:15.5px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-i{font-size:12px;color:var(--muted);margin-top:1px}
.pick-up{text-align:right;flex:0 0 auto;font-family:"Space Grotesk"}
.pick-up .num{font-size:19px;font-weight:700;color:var(--copper)}
.sand-pick .pick-up .num{color:var(--sand)}
.pick-uu{font-size:10.5px;color:var(--muted)}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.why-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-3);padding:4px 9px;border-radius:999px}
.pick-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;
  color:var(--muted);margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);line-height:1.4}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(20,26,36,.42);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:520px;max-height:88vh;background:var(--surface);
  border-radius:24px 24px 0 0;box-shadow:var(--sh-3);display:flex;flex-direction:column;
  animation:rise .24s cubic-bezier(.2,.8,.3,1);padding-bottom:var(--safe-b)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(22px)}to{transform:none}}
.sheet-grip{width:38px;height:4px;border-radius:999px;background:var(--line);margin:9px auto 2px;flex:0 0 auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px 12px;
  border-bottom:1px solid var(--line-2);flex:0 0 auto}
.sheet-title{font-family:"Space Grotesk";font-weight:600;font-size:16px;color:var(--ink);min-width:0}
.sheet-prod{display:flex;align-items:center;gap:11px;min-width:0}
.sheet-prod-n{font-family:"Space Grotesk";font-weight:600;font-size:16px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-prod-i{font-size:12px;color:var(--muted);font-family:Inter;font-weight:400}
.sheet-body{overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px 16px;border-top:1px solid var(--line-2);flex:0 0 auto;background:var(--surface)}
.confirm-t{font-size:13.5px;color:var(--ink-3);margin-bottom:10px;text-align:center}
.confirm-b{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- detail rows ---------- */
.detail{padding:2px 0}
.drow{display:flex;justify-content:space-between;gap:16px;font-size:13.5px;padding:6px 0;color:var(--ink-2);
  border-bottom:1px solid var(--line-2)}
.drow:last-child{border-bottom:0}
.drow span:first-child{color:var(--muted);flex:0 0 auto}
.drow span:last-child{text-align:right;font-family:"Space Grotesk";font-variant-numeric:tabular-nums}
.dsub{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--copper);
  margin:16px 0 4px}

/* ---------- empty / feedback ---------- */
.empty-state{text-align:center;padding:20px 8px 8px}
.empty-ico{width:44px;height:44px;border-radius:14px;background:var(--bg);color:var(--muted);
  display:grid;place-items:center;margin:0 auto 12px}
.empty-t{font-family:"Space Grotesk";font-weight:600;font-size:15.5px;color:var(--ink)}
.empty-b{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;max-width:330px;
  margin-left:auto;margin-right:auto}
.empty-state .btn{margin-top:16px;max-width:260px;margin-left:auto;margin-right:auto}
.err{background:var(--danger-soft);color:var(--danger);border-radius:var(--r-sm);padding:10px 12px;
  font-size:13px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.err .link{color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 14px);
  z-index:70;background:var(--ink);color:#fff;border-radius:999px;padding:10px 16px;font-size:13.5px;
  font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.28);
  animation:rise .2s ease;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}
.spin.small{width:14px;height:14px;border-width:2px}
.spin.dark{border-color:rgba(28,36,49,.2);border-top-color:var(--copper);width:15px;height:15px}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:64px;border-radius:var(--r-md);background:linear-gradient(90deg,#EDEBE6,#F5F3EF,#EDEBE6);
  background-size:200% 100%;animation:sh 1.3s ease-in-out infinite;margin-bottom:12px}
.skel.tall{height:130px}
.skeleton-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.skeleton-grid .skel{height:70px;margin:0}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- auth ---------- */
.auth{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:24px 16px calc(24px + var(--safe-b))}
.auth-inner{width:100%;max-width:400px}
.auth-brand{text-align:center;margin-bottom:22px;display:flex;flex-direction:column;align-items:center;gap:8px}
.auth-brand h1{font-size:27px}
.auth-brand p{margin:0;color:var(--muted);font-size:14px}
.auth-pin{margin-top:6px}
.ulist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.ucard{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);padding:12px 10px;
  display:flex;align-items:center;gap:10px;text-align:left}
.ucard.sel{border-color:var(--copper);background:var(--copper-soft)}
.uavatar{width:32px;height:32px;border-radius:999px;color:#fff;display:grid;place-items:center;
  font-family:"Space Grotesk";font-weight:700;font-size:14px;flex:0 0 auto}
.unm{font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* "Sugerencias" is the longest tab label; give it room on small phones. */
@media (max-width:390px){
  .tabb{font-size:9.5px;letter-spacing:0}
  .tabb span{padding:0 1px}
}
@media (max-width:360px){
  .cat-grid{grid-template-columns:repeat(3,1fr)}
  .hero-v{font-size:31px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
